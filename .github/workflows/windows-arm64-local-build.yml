name: windows-arm64-local-build
on:
  push:
    branches:
      - test/windows-arm64-local-build
    paths:
      - .github/workflows/windows-arm64-local-build.yml
      - .github/scripts/build-windows-arm64-local.py
      - .github/actions/deploy-windows/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-arm64-local-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 360
    env:
      CI_LOCAL_BUILD: 1
      CI_DEPLOY_PLATFORM: windows-arm64
      CI_DEPLOY_MODULE: windows-arm64-local-build
      CI_DEPLOY_NEED_CUDA: 1
      CI_DEPLOY_NEED_CACHE: 1
      CI_DEPLOY_NEED_NVCODEC: 1
      CI_DEPLOY_NEED_TENSORRT: 1
      CI_DEPLOY_USERNAME: ''
      CI_DEPLOY_PASSWORD: ''
      TEMP: C:\temp
      TMP: C:\temp
      BUILD_DIR: C:\build
    steps:
      - name: Create temporary directory
        shell: cmd
        run: if not exist "%TEMP%" mkdir "%TEMP%"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 32GB
          maximum-size: 64GB
          disk-root: 'C:'
      - uses: ./.github/actions/deploy-windows
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-local-build-logs
          path: .ci-logs/
          if-no-files-found: warn
          retention-days: 7
