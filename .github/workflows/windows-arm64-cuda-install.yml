name: windows-arm64-cuda-install
on:
  push:
    branches:
      - test/windows-arm64-cuda-install
    paths:
      - .github/workflows/windows-arm64-cuda-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Inspect runner
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'cuda-install-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, OSArchitecture, LastBootUpTime, TotalVisibleMemorySize, FreePhysicalMemory |
            Format-List | Out-String | Tee-Object -FilePath "$diagnosticDirectory/runner.txt"
          Get-Volume | Select-Object DriveLetter, Size, SizeRemaining | Format-Table
          "Image: $env:ImageOS $env:ImageVersion"
          "TEMP=$env:TEMP"
          "TMP=$env:TMP"
          "Runner inspection completed at $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
      - name: Download CUDA 13.4.2 ARM64
        shell: pwsh
        timeout-minutes: 35
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_13.4.2_windows_arm64.exe'
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 1800 --output $installerPath https://developer.download.nvidia.com/compute/cuda/13.4.2/local_installers/cuda_13.4.2_windows_arm64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item -LiteralPath $installerPath | Select-Object FullName, Length
          Get-FileHash -LiteralPath $installerPath -Algorithm SHA256
          "CUDA download completed at $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
      - name: Install CUDA with the existing silent command
        shell: pwsh
        timeout-minutes: 35
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_13.4.2_windows_arm64.exe'
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'cuda-install-diagnostics'
          "CUDA installation started at $([DateTime]::UtcNow.ToString('o'))"
          $installationProcess = Start-Process -FilePath $installerPath -ArgumentList '-s' -WindowStyle Hidden -Wait -PassThru
          $installationStatus = $installationProcess.ExitCode
          "CUDA installer exit code: $installationStatus" | Tee-Object -FilePath "$diagnosticDirectory/installer-exit.txt"
          "CUDA installer exited with $installationStatus at $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
          if ($installationStatus -ne 0 -and $installationStatus -ne 3010) { exit $installationStatus }
          if ($installationStatus -eq 3010) { Write-Warning 'The installer requested a reboot; this workflow will not reboot the runner.' }
      - name: Verify CUDA installation
        shell: pwsh
        run: |
          $cudaDirectory = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit/CUDA/v13.4'
          if (-not (Test-Path "$cudaDirectory/include/cuda.h")) { throw 'CUDA header is missing.' }
          $compilerPath = Get-ChildItem -LiteralPath $cudaDirectory -Filter nvcc.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerPath) { throw 'nvcc.exe was not installed.' }
          & $compilerPath --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-CimInstance Win32_OperatingSystem | Select-Object LastBootUpTime, FreePhysicalMemory | Format-List
          'CUDA installation and compiler version check passed. No presets were built.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-arm64-install-diagnostics
          path: ${{ runner.temp }}/cuda-install-diagnostics/
          if-no-files-found: warn
          retention-days: 7
