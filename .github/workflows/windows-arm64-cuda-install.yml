name: windows-arm64-cuda-install
on:
  push:
    branches:
      - test/windows-arm64-cuda-install
    paths:
      - .github/workflows/windows-arm64-cuda-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Inspect runner
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'cuda-install-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, OSArchitecture, LastBootUpTime, TotalVisibleMemorySize, FreePhysicalMemory |
            Format-List | Out-String | Tee-Object -FilePath "$diagnosticDirectory/runner.txt"
          Get-Volume | Select-Object DriveLetter, Size, SizeRemaining | Format-Table
          "Image: $env:ImageOS $env:ImageVersion"
          "TEMP=$env:TEMP"
          "TMP=$env:TMP"
          "Runner inspection completed at $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
      - name: Download CUDA 13.4.2 ARM64
        shell: pwsh
        timeout-minutes: 35
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_13.4.2_windows_arm64.exe'
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 1800 --output $installerPath https://developer.download.nvidia.com/compute/cuda/13.4.2/local_installers/cuda_13.4.2_windows_arm64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item -LiteralPath $installerPath | Select-Object FullName, Length
          Get-FileHash -LiteralPath $installerPath -Algorithm SHA256
          "CUDA download completed at $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
      - name: List CUDA archive contents
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_13.4.2_windows_arm64.exe'
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'cuda-install-diagnostics'
          $archiveTool = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $archiveTool l -slt $installerPath > "$diagnosticDirectory/archive-listing.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$diagnosticDirectory/archive-listing.txt" -TotalCount 60
          'Archive listing completed without executing the installer.' >> $env:GITHUB_STEP_SUMMARY
      - name: Extract CUDA archive
        shell: pwsh
        timeout-minutes: 30
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_13.4.2_windows_arm64.exe'
          $extractionDirectory = Join-Path $env:RUNNER_TEMP 'cuda-arm64-extracted'
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'cuda-install-diagnostics'
          $archiveTool = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $archiveTool x $installerPath "-o$extractionDirectory" -y -bb0 -bsp0 | Tee-Object -FilePath "$diagnosticDirectory/extraction.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Archive extraction completed at $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
      - name: Record extracted file inventory
        shell: pwsh
        run: |
          $extractionDirectory = Join-Path $env:RUNNER_TEMP 'cuda-arm64-extracted'
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'cuda-install-diagnostics'
          $files = @(Get-ChildItem -LiteralPath $extractionDirectory -File -Recurse)
          $files | ForEach-Object {
            [pscustomobject]@{
              Path = [System.IO.Path]::GetRelativePath($extractionDirectory, $_.FullName)
              Bytes = $_.Length
            }
          } | ConvertTo-Json -Depth 3 | Set-Content "$diagnosticDirectory/files.json"
          Get-ChildItem -LiteralPath $extractionDirectory |
            Select-Object Mode, Name, Length | Format-Table -AutoSize |
            Out-String -Width 240 | Tee-Object -FilePath "$diagnosticDirectory/top-level.txt"
          $files | Where-Object { $_.Name -match '^(cuda\.h|nvcc\.exe|cudart.*\.(lib|dll)|cublas.*\.(lib|dll)|cusparse.*\.(lib|dll)|nvrtc.*\.(lib|dll))$' } |
            ForEach-Object { [System.IO.Path]::GetRelativePath($extractionDirectory, $_.FullName) } |
            Tee-Object -FilePath "$diagnosticDirectory/toolkit-paths.txt"
          "Extracted files: $($files.Count)" >> $env:GITHUB_STEP_SUMMARY
          "Extracted bytes: $(($files | Measure-Object -Property Length -Sum).Sum)" >> $env:GITHUB_STEP_SUMMARY
          Get-Volume | Select-Object DriveLetter, Size, SizeRemaining | Format-Table
          Get-CimInstance Win32_OperatingSystem | Select-Object LastBootUpTime, FreePhysicalMemory | Format-List
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-arm64-archive-inventory
          path: ${{ runner.temp }}/cuda-install-diagnostics/
          if-no-files-found: warn
          retention-days: 7
